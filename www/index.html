<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Joelho Timer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <img src="assets/joelho.png" alt="Joelho Logo" class="logo">
        <h1>Joelho Timer</h1>
        
        <div class="setup">
            <div class="input-group">
                <label>Execução</label>
                <input type="number" id="execucao" value="30" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>Descanso</label>
                <input type="number" id="descanso" value="10" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>Ciclos</label>
                <input type="number" id="ciclos" value="3" inputmode="numeric">
            </div>
        </div>

        <div class="display">
            <h2 id="fase">Pronto</h2>
            <div id="tempo">00:00</div>
            <p id="ciclo-info">Ciclo 1 de 1</p>
        </div>

        <div class="controles">
            <button id="btn-iniciar" class="btn-success">
                <i class="fas fa-play"></i> INICIAR
            </button>
            <button onclick="pausar()" class="btn-warning">
                <i class="fas fa-pause"></i> PAUSAR
            </button>
            <button onclick="resetar()" class="btn-danger">
                <i class="fas fa-redo"></i> RESET
            </button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
